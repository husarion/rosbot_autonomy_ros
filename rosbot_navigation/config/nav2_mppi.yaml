---
# MPPI controller-specific Nav2 parameters, merged with nav2_common.yaml at launch.

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.01    # Measured
    min_y_velocity_threshold: 0.01    # Measured
    min_theta_velocity_threshold: 0.02
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    odom_topic: odometry/filtered

    # Progress checker parameters
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.4
      movement_time_allowance: 8.0
    # Goal checker parameters
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.2
      stateful: true

    # MPPI controller
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 28
      # Must equal 1 / controller_frequency (nav2_mppi_controller::Optimizer::setOffset
      # throws otherwise). controller_frequency dropped to 10.0 above without this
      # following, so MPPI failed to configure on every launch.
      model_dt: 0.1
      batch_size: 1000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      vx_std: 0.35
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.7
      vx_min: -0.4
      vy_max: 0.4
      vy_min: -0.4
      wz_max: 2.0
      iteration_count: 1
      prune_distance: 2.1
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      regenerate_noises: false
      visualize: false
      publish_optimal_trajectory: false
      TrajectoryVisualizer:
        trajectory_step: 10
        time_step: 5
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic,
        PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.7
        # One costmap lookup per 4th rollout point (the single heaviest critic).
        # consider_footprint is false, so only vx_max sets the lookup spacing:
        # 4 * model_dt * vx_max = 4 * 0.1 * 0.7 = 0.28 m between lookups. At
        # model_dt 0.1 a single step (0.07 m) already exceeds one costmap cell
        # (0.05 m), so no trajectory_point_step restores a strict no-cell-skipped
        # guarantee — that would need a smaller model_dt. The real margin is
        # inflation_radius (0.7 m, see nav2_common.yaml): 0.28 m is ~40% of it, so
        # consecutive lookups still overlap any obstacle's inflated halo.
        trajectory_point_step: 4
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 8
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 6
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.7
        mode: 0
