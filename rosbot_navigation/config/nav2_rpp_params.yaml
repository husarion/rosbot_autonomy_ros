---
# RPP controller-specific Nav2 parameters, merged with nav2_common_params.yaml at launch.

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 5.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.01    # Measured
    min_y_velocity_threshold: 0.01    # Measured
    min_theta_velocity_threshold: 0.1 # Measured
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    odom_topic: odometry/filtered

    # Progress checker parameters
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true

    # Regulated Pure Pursuit controller
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      # Velocity/acceleration limits also have to be adjusted in the velocity smoother
      desired_linear_vel: 0.4
      lookahead_dist: 0.5
      transform_tolerance: 0.25

      # Adaptive lookahead gain
      use_velocity_scaled_lookahead_dist: false # Currently doesn't work, uncomment in next release
      lookahead_time: 1.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6

      # Approach to goal
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 0.5

      # Collision detector
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      # Curvature velocity penalty
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5

      # Cost spaces velocity penalty
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.55
      cost_scaling_gain: 0.8 # Should be <= 1.0
      inflation_cost_scaling_factor: 3.0

      # Minimum speed in high cost spaces with high curvature
      regulated_linear_scaling_min_speed: 0.25

      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.7

      # rotate_to_heading_angular_vel is ignored — robot rotates with max_angular_accel/10
      max_angular_accel: 7.0
      rotate_to_heading_angular_vel: 2.5
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.02
      footprint: '[[<min_x>, <min_y>], [<min_x>, <max_y>], [<max_x>, <max_y>], [<max_x>, <min_y>]]'
      plugins: [voxel_layer, inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /<namespace>/scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: '[[<min_x>, <min_y>], [<min_x>, <max_y>], [<max_x>, <max_y>], [<max_x>, <min_y>]]'
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /<namespace>/scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 5.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 500000
      max_on_approach_iterations: 500
      max_planning_time: 3.0
      cost_travel_multiplier: 2.5
      use_final_approach_orientation: false
      smoother:
        max_iterations: 800
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-9

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-9
      max_its: 800
      do_refinement: true

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 5.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    max_velocity: [1.0, 1.0, 2.0]
    min_velocity: [-1.0, -1.0, -2.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.01, 0.1] # Measured
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.1
    source_timeout: 0.5
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach, PolygonSlow]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
    PolygonSlow:
      type: polygon
      points: '[[0.6, 0.4], [0.6, -0.4], [0.0, -0.4], [0.0, 0.4]]'
      action_type: slowdown
      min_points: 4
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: polygon_slowdown
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan_filtered
